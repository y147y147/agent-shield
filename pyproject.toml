[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-shield"
version = "0.4.0"
description = "Open-source red-team & runtime-guard framework for LLM agents (智能体安全攻防框架)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "y147y147", email = "149349288+y147y147@users.noreply.github.com" }]
keywords = ["llm", "agent", "security", "prompt-injection", "red-team", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<16",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
agent-shield = "agent_shield.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agent_shield"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring real LLM API (set AUDIT_LLM_MODEL or OPENAI_MODEL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Typer CLI 惯用写法：Option 调用在参数默认值中（B008 为此场景误报）
"agent_shield/cli.py" = ["B008"]
